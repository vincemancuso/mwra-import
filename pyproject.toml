[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mwra-homebrewing-water-profile"
version = "0.1.0"
description = "Convert MWRA Metro-Boston water reports into practical homebrewing water profiles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/vincemancuso/mwra-import"
Repository = "https://github.com/vincemancuso/mwra-import"
Issues = "https://github.com/vincemancuso/mwra-import/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
